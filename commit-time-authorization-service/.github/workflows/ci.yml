# Full build and test suite on a GitHub-hosted runner.
# The integration tests use Testcontainers, which starts PostgreSQL through the runner's Docker
# daemon (preinstalled on ubuntu-24.04 runners); no service containers or secrets are needed.
# The k6 load test and the restart/recovery check are local, on-demand tools (see RUNBOOK.md)
# and are intentionally not part of CI.
# Gitleaks scans git history only (not gitignored load-test/results/).
# Dependency-Check is opt-in via the security-audit profile so the default verify job stays fast.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (JDK 21, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Docker version (required by Testcontainers)
        run: docker version

      - name: Build and run all tests
        run: ./mvnw -B clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments and SARIF upload need write permissions this workflow does not grant.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-audit:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-nvd-${{ hashFiles('pom.xml') }}
          restore-keys: dependency-check-nvd-

      - name: Fail the build on CVSS 9+ findings
        run: ./mvnw -B -Psecurity-audit -DskipTests org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
